<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B0B0B'/><text x='50' y='65' font-family='serif' font-size='50' font-weight='bold' fill='%23D4AF37' text-anchor='middle'>NG</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Narrow Gauge brings together three distinct hospitality experiences under one roof: Narrow Gauge Restaurant, NG Catters, and Uknow Café." />
    <meta name="theme-color" content="#0B0B0B" />
    <title>Narrow Gauge | Restaurant · Catering · Café</title>
    <script>
      (function() {
        var saved = localStorage.getItem('ng_theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <!-- Google Fonts Preconnect & Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0B0B0B] text-[#F5F2EA] antialiased selection:bg-[#C5A880]/30 selection:text-[#F5F2EA] overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
